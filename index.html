<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Form Editor</title>
  <link rel="stylesheet" href="styles.css?v=8" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js?v=12" defer></script>
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i data-lucide="file-pen-line"></i></div>
      <div>
        <strong>Form Editor</strong>
        <span id="fieldStatus">Toca una casilla para escribir</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <div class="page-nav" aria-label="Páginas">
        <button class="icon-btn" id="prevPage" type="button" aria-label="Página anterior"><i data-lucide="chevron-left"></i></button>
        <button class="page-indicator" id="pageIndicator" type="button" aria-label="Página actual">1 / 2</button>
        <button class="icon-btn" id="nextPage" type="button" aria-label="Página siguiente"><i data-lucide="chevron-right"></i></button>
      </div>

      <div class="zoom-group" aria-label="Zoom">
        <button class="icon-btn" id="zoomOut" type="button" aria-label="Alejar"><i data-lucide="minus"></i></button>
        <button class="zoom-value" id="zoomValue" type="button" aria-label="Ajustar a pantalla">100%</button>
        <button class="icon-btn" id="zoomIn" type="button" aria-label="Acercar"><i data-lucide="plus"></i></button>
      </div>

      <button class="ghost-btn" id="clearBtn" type="button">
        <i data-lucide="eraser"></i>
        <span>Borrar</span>
      </button>

      <button class="done-btn" id="doneBtn" type="button">
        <i data-lucide="check"></i>
        <span>Listo</span>
      </button>
    </div>
  </header>

  <div class="page2-tools is-hidden" id="page2Tools" aria-label="Herramientas de la segunda página">
    <button class="asset-btn" id="signatureBtn" type="button">
      <i data-lucide="signature"></i>
      <span>Cargar firma</span>
    </button>
    <button class="asset-btn" id="stampBtn" type="button">
      <i data-lucide="stamp"></i>
      <span>Cargar cuño</span>
    </button>
  </div>

  <input class="hidden-file-input" id="signatureInput" type="file" accept="image/*" />
  <input class="hidden-file-input" id="stampInput" type="file" accept="image/*" />

  <header class="preview-toolbar" id="previewToolbar" aria-hidden="true">
    <button class="ghost-btn" id="editBtn" type="button">
      <i data-lucide="pencil"></i>
      <span>Editar</span>
    </button>
    <div class="preview-title">Resultado</div>
    <button class="ghost-btn" id="printBtn" type="button">
      <i data-lucide="printer"></i>
      <span>Imprimir / PDF</span>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="page-shell page-shell-one" id="pageShell">
      <section class="page page-one" id="formPage" aria-label="Formulario ruso editable, página 1">
        <div class="form-overlay" id="overlay"></div>
      </section>
    </div>

    <div class="page-shell page-shell-two is-hidden" id="pageShell2">
      <section class="page page-two" id="formPage2" aria-label="Formulario ruso editable, página 2">
        <div class="form-overlay" id="overlay2"></div>
      </section>
    </div>
  </main>

  <div class="hint" id="hint">
    <i data-lucide="mouse-pointer-2"></i>
    <span>Escribe directamente sobre las casillas. Los datos se guardan en este dispositivo.</span>
  </div>
</body>
</html>
